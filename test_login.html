<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 配置Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#f3f4f6',
                        dark: '#1f2937',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            }
        }
    </script>
    <!-- 自定义工具类 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .form-input-focus {
                @apply focus:ring-2 focus:ring-primary/50 focus:border-primary focus:outline-none;
            }
            .btn-primary {
                @apply bg-primary hover:bg-primary/90 text-white font-medium py-2 px-4 rounded-lg transition-all duration-200;
            }
            .btn-secondary {
                @apply bg-secondary hover:bg-secondary/80 text-dark font-medium py-2 px-4 rounded-lg transition-all duration-200;
            }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- 头部 -->
        <div class="bg-gradient-to-r from-primary to-blue-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white">用户登录</h1>
            <p class="text-blue-100 mt-1">欢迎回来，请登录您的账号</p>
        </div>
        
        <!-- 登录表单 -->
        <div class="p-6">
            <form id="loginForm" class="space-y-4">
                <!-- 用户名/邮箱 -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">用户名或邮箱</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa fa-user"></i>
                        </span>
                        <input type="text" id="username" name="username" 
                            class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg form-input-focus transition-all duration-200"
                            placeholder="请输入用户名或邮箱"
                            required>
                    </div>
                </div>
                
                <!-- 密码 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa fa-lock"></i>
                        </span>
                        <input type="password" id="password" name="password" 
                            class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg form-input-focus transition-all duration-200"
                            placeholder="请输入密码"
                            required>
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <!-- 记住我和忘记密码 -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember" name="remember" type="checkbox" 
                            class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                        <label for="remember" class="ml-2 block text-sm text-gray-700">
                            记住我
                        </label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-primary hover:text-primary/80">
                            忘记密码？
                        </a>
                    </div>
                </div>
                
                <!-- 登录按钮 -->
                <div>
                    <button type="submit" class="w-full btn-primary flex items-center justify-center">
                        <i class="fa fa-sign-in mr-2"></i>
                        登录
                    </button>
                </div>
                
                <!-- 分隔线 -->
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-gray-500">或使用以下方式登录</span>
                    </div>
                </div>
                
                <!-- 第三方登录 -->
                <div class="grid grid-cols-3 gap-3">
                    <button type="button" class="btn-secondary flex items-center justify-center">
                        <i class="fa fa-weixin text-green-500 mr-2"></i>
                        <span class="text-sm">微信</span>
                    </button>
                    <button type="button" class="btn-secondary flex items-center justify-center">
                        <i class="fa fa-qq text-blue-400 mr-2"></i>
                        <span class="text-sm">QQ</span>
                    </button>
                    <button type="button" class="btn-secondary flex items-center justify-center">
                        <i class="fa fa-weibo text-red-500 mr-2"></i>
                        <span class="text-sm">微博</span>
                    </button>
                </div>
            </form>
        </div>
        
        <!-- 底部 -->
        <div class="bg-gray-50 px-6 py-4 border-t border-gray-200">
            <p class="text-center text-sm text-gray-600">
                还没有账号？
                <a href="#" class="font-medium text-primary hover:text-primary/80">
                    立即注册
                </a>
            </p>
        </div>
    </div>
    
    <!-- 登录成功提示 -->
    <div id="successToast" class="fixed top-4 right-4 bg-green-500 text-white px-4 py-3 rounded-lg shadow-lg flex items-center transform translate-x-full transition-transform duration-300 opacity-0">
        <i class="fa fa-check-circle mr-2"></i>
        <span>登录成功！</span>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 密码显示/隐藏切换
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            
            togglePassword.addEventListener('click', function() {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                
                // 切换图标
                const icon = togglePassword.querySelector('i');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });
            
            // 表单提交处理
            const loginForm = document.getElementById('loginForm');
            const successToast = document.getElementById('successToast');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // 获取表单数据
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const remember = document.getElementById('remember').checked;
                
                // 简单的表单验证
                if (!username || !password) {
                    alert('请填写所有必填字段');
                    return;
                }
                
                // 模拟登录请求
                console.log('登录请求:', { username, password, remember });
                
                // 模拟登录成功
                setTimeout(function() {
                    // 显示成功提示
                    successToast.classList.remove('translate-x-full', 'opacity-0');
                    
                    // 3秒后隐藏提示
                    setTimeout(function() {
                        successToast.classList.add('translate-x-full', 'opacity-0');
                    }, 3000);
                    
                    // 这里可以添加跳转到首页的逻辑
                    // window.location.href = 'index.html';
                }, 1000);
            });
            
            // 第三方登录按钮点击事件
            const thirdPartyButtons = document.querySelectorAll('.btn-secondary');
            thirdPartyButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const platform = this.querySelector('span').textContent;
                    console.log(`使用${platform}登录`);
                    alert(`跳转到${platform}登录页面`);
                });
            });
        });
    </script>
</body>
</html>
